# Baut den Windows-Installer automatisch und haengt ihn an das Release.
# Ausloeser: ein neuer Versions-Tag (z. B. v7.0.0) oder manuell unter "Actions".
# Bewusst in Flow-Schreibweise (alles linksbuendig), damit der Web-Editor die Einrueckung nicht verschiebt.
# WICHTIG: latest.yml muss mit hochgeladen werden - daraus liest die App (electron-updater), ob es etwas Neues gibt.
# Das Release wird angelegt, falls es noch nicht existiert: "gh release upload" allein scheitert an einem
# reinen Tag-Push, weil es ein vorhandenes Release voraussetzt. Ein Tag genuegt jetzt fuer alles.
name: Installer bauen
on: {push: {tags: ['v*']}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {build: {runs-on: windows-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: '20'}}, {name: Abhaengigkeiten, run: npm install}, {name: Tests, run: 'node test-channel.js && node test-v6.js'}, {name: Installer bauen, run: 'npx electron-builder --win nsis --x64 --publish never'}, {name: Release anlegen falls noetig, if: "startsWith(github.ref, 'refs/tags/')", env: {GH_TOKEN: '${{ github.token }}'}, run: 'gh release view ${{ github.ref_name }} 2>$null; if ($LASTEXITCODE -ne 0) { gh release create ${{ github.ref_name }} --title "Markt-Dashboard ${{ github.ref_name }}" --notes "Automatisch gebauter Installer." } else { Write-Host "Release existiert bereits" }'}, {name: An Release anhaengen, if: "startsWith(github.ref, 'refs/tags/')", env: {GH_TOKEN: '${{ github.token }}'}, run: 'gh release upload ${{ github.ref_name }} dist/Markt-Dashboard-Setup.exe dist/latest.yml --clobber'}, {name: Installer als Artefakt sichern, uses: actions/upload-artifact@v4, with: {name: Markt-Dashboard-Setup, path: dist/Markt-Dashboard-Setup.exe}}]}}
