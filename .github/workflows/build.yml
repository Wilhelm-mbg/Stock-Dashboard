# Zwei Jobs mit verschiedenen Aufgaben.
#
# "pruefen" laeuft bei JEDEM Push und jedem Pull Request. Vorher lief die Testsuite nur
# beim Setzen eines Versions-Tags - die beiden Regressionen vom 23.08.2026 (der geloeschte
# stcRunning-Deklaration und der zu weite .pills-Umschalter) haetten also selbst mit
# passenden Tests keine rote Lampe erzeugt. Jetzt ist der Push die Kontrolle.
#
# "installer" laeuft nur beim Tag und braucht ein gruenes "pruefen". Die Testsuite laeuft
# dort ein ZWEITES Mal, diesmal NACH dem Build: Abschnitt 31 von test-v6.js vergleicht das
# gebaute Paket mit der Quelle und kann das nur, wenn dist/ schon existiert. Vorher lief
# sie davor und die Pruefung war im Release-Pfad wirkungslos.
#
# npm ci statt npm install: sonst darf die Lockdatei fortgeschrieben werden und derselbe
# Tag ergibt an zwei Tagen zwei verschiedene Installer.
#
# WICHTIG: latest.yml muss mit hochgeladen werden - daraus liest die App (electron-updater), ob es etwas Neues gibt.
# Bewusst in Flow-Schreibweise (alles linksbuendig), damit der Web-Editor die Einrueckung nicht verschiebt.
name: Pruefen und Installer bauen
on: {push: {branches: ['**'], tags: ['v*']}, pull_request: {}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {pruefen: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: '20', cache: npm}}, {name: Abhaengigkeiten, run: npm ci}, {name: Linter, run: npx eslint .}, {name: Tests, run: 'node test-channel.js && node test-v6.js'}]}, installer: {needs: pruefen, if: "startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'", runs-on: windows-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: '20', cache: npm}}, {name: Abhaengigkeiten, run: npm ci}, {name: Tag und package.json muessen dieselbe Version nennen, if: "startsWith(github.ref, 'refs/tags/')", run: '$tag = "${{ github.ref_name }}" -replace "^v", ""; $pkg = (Get-Content package.json | ConvertFrom-Json).version; if ($tag -ne $pkg) { Write-Error "Tag $tag und package.json $pkg stimmen nicht ueberein"; exit 1 } else { Write-Host "Version $pkg" }'}, {name: Installer bauen, run: 'npx electron-builder --win nsis --x64 --publish never'}, {name: Tests gegen das gebaute Paket, run: 'node test-channel.js && node test-v6.js'}, {name: Release anlegen falls noetig, if: "startsWith(github.ref, 'refs/tags/')", env: {GH_TOKEN: '${{ github.token }}'}, run: 'gh release view ${{ github.ref_name }} 2>$null; if ($LASTEXITCODE -ne 0) { gh release create ${{ github.ref_name }} --title "Markt-Dashboard ${{ github.ref_name }}" --notes "Automatisch gebauter Installer." } else { Write-Host "Release existiert bereits" }'}, {name: An Release anhaengen, if: "startsWith(github.ref, 'refs/tags/')", env: {GH_TOKEN: '${{ github.token }}'}, run: 'gh release upload ${{ github.ref_name }} dist/Markt-Dashboard-Setup.exe dist/latest.yml --clobber'}, {name: Installer als Artefakt sichern, uses: actions/upload-artifact@v4, with: {name: Markt-Dashboard-Setup, path: dist/Markt-Dashboard-Setup.exe}}]}}
